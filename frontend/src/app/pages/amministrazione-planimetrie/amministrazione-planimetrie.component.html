<app-header></app-header>

<main class="flex-1 w-full min-h-screen bg-gradient-to-b from-[var(--color-expriviaBlue)] to-[var(--color-expriviaBlue)]/90" role="main">

    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10 pointer-events-none" aria-hidden="true">
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0zNiAzNGMwIDIuMjA5LTEuNzkxIDQtNCA0cy00LTEuNzkxLTQtNCAxLjc5MS00IDQtNCA0IDEuNzkxIDQgNHoiIGZpbGw9IiNmZmYiLz48L2c+PC9zdmc+')]"></div>
    </div>

    <section class="relative py-8 px-4 sm:px-6 lg:px-10" aria-labelledby="admin-planimetrie-title">
        <div class="max-w-7xl mx-auto flex flex-col gap-6 mt-6">

            <!-- ── TOP BAR: Titolo + Filtro Sede ── -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4" @fadeIn>

                <!-- Titolo -->
                <div>
                    <h1 id="admin-planimetrie-title"
                        class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight leading-tight">
                        Gestione Planimetrie
                    </h1>
                    <p class="text-white/60 text-sm mt-1">
                        Seleziona la sede, poi modifica o carica la planimetria.
                    </p>
                </div>

                <!-- Filtro Sede + Conferma -->
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <select
                            id="sede-select"
                            (change)="onSedeChange($event)"
                            [disabled]="isConfirmed"
                            class="bg-white/10 backdrop-blur-md border border-white/20 text-white rounded-xl
                                   px-4 py-2.5 pr-10 text-sm font-medium
                                   focus:outline-none focus:ring-2 focus:ring-[var(--color-expriviaOrange)]
                                   transition-colors cursor-pointer appearance-none
                                   disabled:opacity-50 disabled:cursor-not-allowed">
                            <option value="" disabled selected class="text-gray-900">Seleziona sede...</option>
                            <option *ngFor="let sede of sedi" [value]="sede" class="text-gray-900">{{ sede }}</option>
                        </select>
                        <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
                            <i class="fas fa-chevron-down text-white/60 text-xs"></i>
                        </div>
                    </div>

                    <!-- Pulsante Conferma (solo se non ancora confermato) -->
                    <app-button
                        *ngIf="!isConfirmed"
                        label="Conferma"
                        type="primary"
                        size="md"
                        icon="fas fa-check"
                        iconPosition="right"
                        [disabled]="!selectedSede"
                        (click)="onConfirm()"
                        aria-label="Conferma selezione sede">
                    </app-button>

                    <!-- Pulsante Cambia Sede (solo se già confermato) -->
                    <app-button
                        *ngIf="isConfirmed"
                        label="Cambia Sede"
                        type="ghost"
                        size="md"
                        icon="fas fa-exchange-alt"
                        (click)="resetSede()"
                        aria-label="Cambia sede">
                    </app-button>
                </div>
            </div>

            <!-- ── EDITOR PANEL (visibile solo dopo conferma) ── -->
            <div *ngIf="isConfirmed" class="flex flex-col gap-4" @fadeIn>

                <!-- Toolbar Editor -->
                <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-3 flex flex-wrap items-center gap-3">

                    <span class="text-white/60 text-xs font-semibold uppercase tracking-widest mr-1">Editor</span>

                    <div class="h-5 w-px bg-white/20"></div>

                    <!-- Crea Stanza -->
                    <app-button
                        *ngIf="imageUrl"
                        label="Crea Stanza"
                        type="primary"
                        size="sm"
                        icon="fas fa-plus-square"
                        (click)="aggiungiStanza()"
                        aria-label="Aggiungi stanza alla planimetria">
                    </app-button>

                    <!-- Crea Postazione -->
                    <app-button
                        *ngIf="imageUrl"
                        label="Crea Postazione"
                        type="primary"
                        size="sm"
                        icon="fas fa-plus-circle"
                        (click)="aggiungiPostazione()"
                        aria-label="Aggiungi postazione alla planimetria">
                    </app-button>

                    <!-- Salva -->
                    <app-button
                        *ngIf="imageUrl"
                        label="Salva"
                        type="ghost"
                        size="sm"
                        icon="fas fa-save"
                        (click)="salvaDati()"
                        aria-label="Salva dati planimetria">
                    </app-button>

                    <div class="h-5 w-px bg-white/20 ml-1"></div>

                    <!-- Carica File -->
                    <app-button
                        label="Carica Planimetria"
                        type="ghost"
                        size="sm"
                        icon="fas fa-upload"
                        (click)="fileInput.click()"
                        aria-label="Carica file planimetria">
                    </app-button>

                    <input type="file" #fileInput (change)="onFileSelected($event)" accept=".png" class="hidden" />

                    <!-- Suggerimento zoom/pan -->
                    <div class="ml-auto flex items-center gap-4 text-white/40 text-xs">
                        <span><i class="fas fa-search-plus mr-1"></i>Scroll = Zoom</span>
                        <span><i class="fas fa-hand-paper mr-1"></i>Drag sfondo = Pan</span>
                        <span><i class="fas fa-trash mr-1"></i>Canc = Elimina</span>
                    </div>
                </div>

                <!-- ── AREA MAPPA ── -->
                <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl overflow-hidden shadow-xl">

                    <!-- Placeholder quando non c'è ancora immagine -->
                    <div *ngIf="!imageUrl"
                         class="w-full aspect-video flex flex-col items-center justify-center gap-4 cursor-pointer group"
                         (click)="fileInput.click()">
                        <div class="w-20 h-20 rounded-full bg-[var(--color-expriviaOrange)]/20
                                    border border-[var(--color-expriviaOrange)]/50
                                    flex items-center justify-center
                                    group-hover:bg-[var(--color-expriviaOrange)]/40 transition-colors">
                            <i class="fas fa-plus text-4xl text-[var(--color-expriviaOrange)]"></i>
                        </div>
                        <p class="text-white font-medium text-lg">Clicca per caricare una planimetria</p>
                        <p class="text-white/50 text-sm">Supporta file .png</p>
                    </div>

                    <!-- Canvas Fabric.js -->
                    <div *ngIf="imageUrl" class="flex items-center justify-center bg-black/30 rounded-xl p-2">
                        <canvas id="planimetriaCanvas"></canvas>
                    </div>
                </div>

            </div>

            <!-- ── PLACEHOLDER quando sede non ancora confermata ── -->
            <div *ngIf="!isConfirmed"
                 class="bg-white/5 border border-dashed border-white/20 rounded-xl
                        flex flex-col items-center justify-center py-24 gap-4"
                 @scaleIn>
                <i class="fas fa-map-marked-alt text-5xl text-white/20"></i>
                <p class="text-white/40 text-base font-medium">Seleziona e conferma una sede per iniziare</p>
            </div>

        </div>
    </section>
</main>
