<app-header></app-header>

<main class="flex-1 w-full min-h-screen bg-gradient-to-b from-[var(--color-expriviaBlue)] to-[var(--color-expriviaBlue)]/90" role="main">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10 pointer-events-none" aria-hidden="true">
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0zNiAzNGMwIDIuMjA5LTEuNzkxIDQtNCA0cy00LTEuNzkxLTQtNCAxLjc5MS00IDQtNCA0IDEuNzkxIDQgNHoiIGZpbGw9IiNmZmYiLz48L2c+PC9zdmc+')]"></div>
    </div>

    <section class="relative py-6 sm:py-8 md:py-12 lg:py-16 overflow-hidden" aria-labelledby="admin-planimetrie-title">
        <div class="container px-4 sm:px-6 mx-auto relative flex flex-col items-center mt-6">
            
            <!-- Sede Selection Card -->
            <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-[var(--radius-xl)] p-8 max-w-xl w-full shadow-[var(--shadow-xl)] mb-8" @fadeIn>
                <div class="space-y-4 mb-8 text-center">
                    <h1 id="admin-planimetrie-title" class="text-2xl sm:text-3xl md:text-4xl font-black text-white leading-tight tracking-tight" @slideUp>
                        Amministrazione Planimetrie
                    </h1>
                    <p class="text-sm sm:text-base text-gray-200" @slideUp>
                        Seleziona la sede e conferma per visualizzare o caricare una nuova planimetria.
                    </p>
                </div>

                <div class="flex flex-col space-y-6" @scaleIn>
                    <div class="flex flex-col space-y-2 relative">
                        <label for="sede-select" class="text-white text-sm font-semibold">Sede Aziendale</label>
                        <div class="relative">
                            <select 
                                id="sede-select" 
                                (change)="onSedeChange($event)"
                                [disabled]="isConfirmed"
                                class="w-full bg-white/20 border border-white/30 text-white rounded-[var(--radius-md)] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[var(--color-expriviaOrange)] transition-colors cursor-pointer appearance-none backdrop-blur-sm disabled:opacity-50 disabled:cursor-not-allowed">
                                <option value="" disabled selected class="text-gray-900">Seleziona una sede...</option>
                                <option *ngFor="let sede of sedi" [value]="sede" class="text-gray-900">Sede {{sede}}</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none flex-shrink-0">
                                <i class="fas fa-chevron-down text-white/70"></i>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 flex justify-center" *ngIf="!isConfirmed">
                        <app-button 
                            label="Conferma" 
                            type="primary" 
                            size="lg" 
                            icon="fas fa-check"
                            iconPosition="right" 
                            class="w-full"
                            [disabled]="!selectedSede"
                            (click)="onConfirm()"
                            aria-label="Conferma selezione">
                        </app-button>
                    </div>
                </div>
            </div>
            
            <!-- Upload Area Card (Shown when confirmed) -->
            <div *ngIf="isConfirmed" class="bg-white/10 backdrop-blur-md border border-white/20 rounded-[var(--radius-xl)] p-8 max-w-4xl w-full shadow-[var(--shadow-xl)]" @fadeIn>
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <h2 class="text-xl sm:text-2xl font-bold text-white">
                        Planimetria: Sede {{selectedSede}}
                    </h2>
                    
                    <!-- Separate upload button outside the box -->
                    <app-button 
                        label="Scegli File Planimetria" 
                        type="ghost" 
                        size="md" 
                        icon="fas fa-upload"
                        (click)="fileInput.click()">
                    </app-button>
                </div>
                
                <!-- Hidden File Input -->
                <input type="file" #fileInput (change)="onFileSelected($event)" accept=".png" class="hidden" />

                <!-- Map Container Box -->
                <div class="relative w-full aspect-video border-2 border-dashed border-white/40 rounded-[var(--radius-lg)] bg-black/20 flex flex-col items-center justify-center overflow-hidden transition-all duration-300 hover:border-white/70 group"
                    (click)="!imageUrl ? fileInput.click() : null" [class.cursor-pointer]="!imageUrl">
                    
                    <!-- Plus Icon / Placeholder when empty -->
                    <div *ngIf="!imageUrl" class="text-center p-6 flex flex-col items-center justify-center transform transition-transform group-hover:scale-105">
                        <div class="w-20 h-20 bg-[var(--color-expriviaOrange)]/20 rounded-full flex items-center justify-center mb-4 border border-[var(--color-expriviaOrange)]/50 shadow-lg cursor-pointer hover:bg-[var(--color-expriviaOrange)]/40 transition-colors">
                            <i class="fas fa-plus text-4xl text-[var(--color-expriviaOrange)] drop-shadow-md"></i>
                        </div>
                        <p class="text-white font-medium text-lg mb-1 pointer-events-none">Clicca sul più per aggiungere una planimetria</p>
                        <p class="text-white/60 text-sm pointer-events-none">Supporta file .png</p>
                    </div>

                    <!-- Map Image -->
                    <img *ngIf="imageUrl" [src]="imageUrl" alt="Mappa della sede {{selectedSede}}" class="w-full h-full object-contain p-2" />
                </div>
            </div>
            
        </div>
    </section>
</main>
