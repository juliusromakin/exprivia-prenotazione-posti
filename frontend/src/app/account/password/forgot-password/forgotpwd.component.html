<!-- Container principale con sfondo animato -->
<app-animated-background></app-animated-background>
<app-header class="relative z-10"></app-header>

<main class="flex min-h-screen items-center justify-center px-4 py-12 relative z-10">
  <div class="bg-white/90 backdrop-blur-sm rounded-[var(--radius-2xl)] shadow-[var(--shadow-xl)] flex w-full max-w-md flex-col p-8 overflow-hidden relative">
    
    <!-- Freccia per tornare al login -->
    <a routerLink="/login" 
       class="absolute top-6 left-6 text-gray-400 hover:text-[var(--color-expriviaOrange)] transition-colors duration-300"
       [attr.aria-label]="'AUTH.COMMON.BACK_TO_LOGIN' | translate">
      <mat-icon>arrow_back</mat-icon>
    </a>

    <div class="text-center mt-2">
    <div class="relative inline-block">
        <img src="LogoExprivia.svg" alt="Exprivia Logo"
          class="h-12 mx-auto mb-4 transform hover:scale-110 transition-transform duration-300">
      </div>
    <h1  class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-[var(--color-expriviaOrange)] via-[var(--color-expriviaOrange400)] to-[var(--color-expriviaOrange)] bg-clip-text text-transparent animate-gradient ">{{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}</h1>
    <p class="text-gray-500 mt-2">
      {{ 'AUTH.FORGOT_PASSWORD.SUBTITLE' | translate }}
    </p>
</div>

    <form
      class="flex flex-col gap-6 mt-6"
      [formGroup]="forgotPwdForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >
  
      <!-- Campo email -->
      <div [@slideUp]="{ value: '', params: { delay: '100ms' } }"
        class="transform hover:scale-[1.02] transition-transform duration-300">
        <div class="relative">
          <div class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center justify-center w-6 h-6">
            <lucide-icon name="mail" class="text-gray-400"></lucide-icon>
          </div>
          <input matInput formControlName="email" [placeholder]="'AUTH.FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate" type="email" autocomplete="email"
            class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-expriviaOrange focus:ring-1 focus:ring-expriviaOrange transition-colors duration-200" />
        </div>
        <div *ngIf="forgotPwdForm.get('email')?.hasError('email')" class="text-red-500 text-sm mt-1">
          {{ 'AUTH.FORGOT_PASSWORD.ERRORS.EMAIL_INVALID' | translate }}
        </div>
      </div>

      <!-- Pulsante -->
      <button
        class="bg-expriviaOrange hover:bg-orange-600 transition font-semibold rounded-lg text-white text-sm px-5 py-3 text-center disabled:opacity-50"
        type="submit"
        [disabled]="forgotPwdForm.invalid || isLoading"
      >
        <ng-container *ngIf="!isLoading">{{ 'AUTH.FORGOT_PASSWORD.SUBMIT' | translate }}</ng-container>
        <ng-container *ngIf="isLoading">
          <div class="flex justify-center items-center gap-2">
            <img src="https://cdn3.emoji.gg/emojis/1420-walking.gif" alt="Caricamento..." class="h-6 w-6" />
            <span>{{ 'AUTH.FORGOT_PASSWORD.SENDING' | translate }}</span>
          </div>
        </ng-container>
      </button>
    </form>
  </div>
</main>
