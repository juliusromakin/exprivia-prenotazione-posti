server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gestione delle rotte Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy per le API verso il backend Spring Boot
    location /api/ {
        proxy_pass http://backend:10010/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Aumentiamo i timeout per query lunghe o upload
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;

        # Cors (opzionale se gestito già dal backend, ma utile come backup)
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
